name: Cypress Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    name: Cypress Test Execution
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cypress Execution
        # Official Cypress Action: Handles caching, installing, and running
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          # We use the script from package.json which includes environment flags
          command: npm run cypress:run
          
      - name: Generate Allure Report
        if: always()
        run: |
          # Generate report from results. allure-results is configured in cypress.config.ts
          npx allure generate allure-results --clean -o allure-report || true

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

      - name: Upload Test Evidence (Screenshots & Videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidence
          path: |
            cypress/screenshots
            cypress/videos
            allure-results
          if-no-files-found: ignore
          retention-days: 7
